<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Appointment System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="main-title">
        🏥 Hospital Appointment Management System
  </h1>

    <div class="container">

        <div class="card">

            <h2>Patient Appointment Form</h2>

            <div id="message"></div>

            <form id="appointmentForm">

                <input type="hidden" id="appointmentId">

                <div class="form-group">
                    <input
                        type="text"
                        id="patientName"
                        placeholder="Enter Patient Name"
                        required>
                </div>

                <div class="form-group">
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required>
                </div>

                <div class="form-group">
                    <input
                        type="text"
                        id="mobile"
                        placeholder="Enter Mobile Number"
                        required>
                </div>

                <div class="form-group">
                    <select id="doctorName" required>
                        <option value="">Select Doctor</option>
                        <option value="Dr. Rajesh">Dr. Rajesh</option>
                        <option value="Dr. Priya">Dr. Priya</option>
                        <option value="Dr. Kumar">Dr. Kumar</option>
                    </select>
                </div>

                <div class="form-group">
                    <input
                        type="date"
                        id="appointmentDate"
                        required>
                </div>

                <div class="form-group">
                    <input
                        type="time"
                        id="appointmentTime"
                        required>
                </div>

                <button type="submit">
                    Save Appointment
                </button>

            </form>

        </div>

        <div class="card">

            <h2>Appointment List</h2>

            <table>

                <thead>

                    <tr>
                        <th>S.No</th>
                        <th>Patient Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="appointmentTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
